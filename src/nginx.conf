user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;
#include /etc/nginx/conf.d/*;

events {
	worker_connections 768;
	# multi_accept on;
}

http {
	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	include /etc/nginx/conf.d/*;

	# include /etc/nginx/bots.d/blockbots.conf;
	# include /etc/nginx/bots.d/ddos.conf;

	# allow 188.191.167.78;
	# allow 193.228.130.227;
	# allow 212.232.3.31;
	# deny all;
	allow all;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	##
	# Gzip Settings
	##

	gzip on;
	gzip_types
		application/wasm
	    text/plain
	    text/css
	    application/json
	    application/javascript
	    text/xml
	    application/xml
	    application/xml+rss
	    text/javascript;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	server {
		server_name yutovo.ru yutovo.com nmathematics.ru;

		include /etc/nginx/bots.d/blockbots.conf;
		include /etc/nginx/bots.d/ddos.conf;

		return 301 https://$server_name$request_uri;
	}

	server {
    	listen 443 ssl;
		server_name nmathematics.ru;

		include /etc/nginx/bots.d/blockbots.conf;
		include /etc/nginx/bots.d/ddos.conf;

    	ssl_certificate /etc/letsencrypt/live/nmathematics.ru/fullchain.pem; # managed by Certbot
    	ssl_certificate_key /etc/letsencrypt/live/nmathematics.ru/privkey.pem; # managed by Certbot
    	include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

	    root /var/www/nmathematics.ru;
    	index index.html;
    	
    	location / {
        	try_files $uri $uri/ =404;
    	}
	}
	
    server {
    	listen 443 ssl;
		listen [::]:443 ssl;
        server_name yutovo.ru yutovo.com;

 		include /etc/nginx/bots.d/blockbots.conf;
		include /etc/nginx/bots.d/ddos.conf;

    	ssl_certificate /etc/letsencrypt/live/yutovo.ru/fullchain.pem; # managed by Certbot
    	ssl_certificate_key /etc/letsencrypt/live/yutovo.ru/privkey.pem; # managed by Certbot
    	include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

		access_log /var/log/nginx/yutovo.ru.access.log;
		error_log /var/log/nginx/error.log;

		underscores_in_headers on;

    	# add_header Cross-Origin-Opener-Policy same-origin always;
    	# add_header Cross-Origin-Embedder-Policy require-corp always;
    	# add_header Cross-Origin-Resource-Policy cross-origin always;
    
		location ~* \.(wasm|data|js|css|png|ttf|woff|woff2|ico|html)$ {
    		proxy_pass http://localhost:9001;

    		proxy_set_header X-Real-IP $remote_addr;
    		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    		proxy_set_header Host $http_host;
    		proxy_hide_header Set-Cookie;
    		#more_clear_headers 'Set-Cookie: JSESSIONID';
    		proxy_buffer_size 16k;
    		proxy_busy_buffers_size 32k;
    		proxy_buffers 64 32k;
    		# add_header Cross-Origin-Opener-Policy same-origin always;
    		# add_header Cross-Origin-Embedder-Policy require-corp always;
    		# add_header Cross-Origin-Resource-Policy cross-origin always;
    		# proxy_hide_header Cross-Origin-Opener-Policy;
    		# proxy_hide_header Cross-Origin-Embedder-Policy;
    		# proxy_hide_header Cross-Origin-Resource-Policy;
		}

		location / {
			client_max_body_size 10M;
			proxy_buffer_size 16k;
			proxy_busy_buffers_size 32k;
			proxy_buffers 64 32k;
    		proxy_set_header X-Real-IP $remote_addr;
    		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        	proxy_set_header X-NginX-Proxy true;
       		proxy_set_header Host $http_host;
       		proxy_set_header Referer $http_referer;
			proxy_pass_request_headers on;
			# add_header Cross-Origin-Opener-Policy same-origin always;
			# add_header Cross-Origin-Embedder-Policy require-corp always;
			# add_header Cross-Origin-Resource-Policy cross-origin always;
			# proxy_hide_header Cross-Origin-Opener-Policy;
			# proxy_hide_header Cross-Origin-Embedder-Policy;
			# proxy_hide_header Cross-Origin-Resource-Policy;
            proxy_pass http://localhost:9001;
		}
    }

    server {
    	listen 8443 ssl;
        server_name yutovo.ru;

    	ssl_certificate /etc/letsencrypt/live/yutovo.ru/fullchain.pem; # managed by Certbot
    	ssl_certificate_key /etc/letsencrypt/live/yutovo.ru/privkey.pem; # managed by Certbot
    	include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

		access_log /var/log/nginx/yutovo.ru.redmine.log;
		error_log /var/log/nginx/error.log;

		location / {
        	proxy_pass http://127.0.0.1:3000;
    		proxy_set_header Host yutovo.ru:8443;
    		proxy_set_header X-Real-IP $remote_addr;
    		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    		proxy_set_header X-Forwarded-Proto https;
    		proxy_set_header X-Forwarded-Port 8443;
    		proxy_set_header X-Forwarded-Host yutovo.ru:8443;
    	    proxy_buffer_size 16k;
        	proxy_buffers 4 32k;
        	proxy_redirect off;
        }
    }

    server {
    	listen 4444 ssl;
        server_name awstats_yutovo_ru;
        root /usr/lib/cgi-bin/;

		access_log /var/log/nginx/awstats.yutovo.ru.access.log;
		error_log /var/log/nginx/error.log;

    	ssl_certificate /etc/letsencrypt/live/yutovo.ru/fullchain.pem; # managed by Certbot
    	ssl_certificate_key /etc/letsencrypt/live/yutovo.ru/privkey.pem; # managed by Certbot
        
		location ~ \.pl$ {
			try_files $uri =404;
			gzip off;
			fastcgi_pass 127.0.0.1:8999;
			fastcgi_index index.pl;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			include fastcgi_params;
            auth_basic "Restricted Area";
            auth_basic_user_file /etc/nginx/auth/htpasswd;
		}

		location /awstats/ {
			root /usr/lib/cgi-bin;
			index index.html index.pl;
		}

		location /awstatsclasses/ {
			alias /usr/share/awstats/lib/;
		}

		location /awstats-icon/ {
			alias /usr/share/awstats/icon/;
		}

		location /awstatscss {
			alias /usr/share/doc/awstats/examples/css/;
		}
    }

	map $http_upgrade $connection_upgrade {
	    default upgrade;
	    '' close;
	}
	
	upstream gwsocket {
    	server localhost:7890;
	}

   	server {
   		listen 4445 ssl;
   		root /var/www/goaccess;

    	ssl_certificate /etc/letsencrypt/live/yutovo.ru/fullchain.pem; # managed by Certbot
    	ssl_certificate_key /etc/letsencrypt/live/yutovo.ru/privkey.pem; # managed by Certbot

		location / {
            index report.html;
            auth_basic "Restricted Area";
            auth_basic_user_file /etc/nginx/auth/htpasswd;
	        proxy_http_version 1.1;
	        proxy_set_header Upgrade $http_upgrade;
	        proxy_set_header Connection $connection_upgrade;
	        client_max_body_size 1000m;
	        proxy_redirect off;
	        proxy_set_header Host $host;
	        proxy_set_header X-Real-IP $remote_addr;
	        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	        proxy_set_header X-Forwarded-Proto $scheme;
        }

	    location /ws {
	        proxy_pass http://gwsocket;
	    }
   	}
}
