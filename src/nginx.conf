user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {
	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	#include /etc/nginx/sites-enabled/*;

	server {
		listen 80;
		server_name yutovo_ru;
		return 301 https://$server_name$request_uri;
	}
	
    server {
    	listen 443 ssl;
		listen [::]:443 ssl;
        server_name yutovo_ru_ssl;

    	ssl_certificate /home/denis/programs/Math/yutovo/yutovo_server/keys/yutovo_service.crt;
    	ssl_certificate_key /home/denis/programs/Math/yutovo/yutovo_server/keys/yutovo_service.key;

		underscores_in_headers on;

		location / {
			proxy_buffer_size 16k;
			proxy_busy_buffers_size 24k;
			proxy_buffers 64 4k;
    		proxy_set_header X-Real-IP $remote_addr;
    		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        	proxy_set_header X-NginX-Proxy true;
       		proxy_set_header Host $http_host;
			proxy_pass_request_headers on;
            proxy_pass http://192.168.1.192:9001;
		}
    }

    server {
    	listen 9002 ssl;
    	listen [::]:9002 ssl;
    	server_name yutovo_solver;

    	ssl_certificate /home/denis/programs/Math/yutovo/yutovo_server/keys/yutovo_service.crt;
    	ssl_certificate_key /home/denis/programs/Math/yutovo/yutovo_server/keys/yutovo_service.key;

		location / {
   			proxy_http_version 1.1;
    		proxy_set_header Upgrade $http_upgrade;
    		proxy_set_header Connection "Upgrade";
    		proxy_set_header Host $host;
    		proxy_set_header X-Real-IP $remote_addr;
    		proxy_set_header Host $host;
    		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_pass https://yutovo.ru:8010;
		}
    }
}
